<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Pokédex do Grupo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="logo">Pokédex do Grupo 2</p>
    <nav>
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="explorar.html">Explorar</a></li>
        <li><a href="ferramentas.html">Ferramentas</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
    <button id="botaoTema" type="button">Modo escuro</button>
  </header>
  <main>
    <section>
      <h1>Contato</h1>
      <form id="formContato" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone">
        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="1" required>
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="4" required placeholder="Conte qual é seu Pokémon favorito"></textarea>
        <button type="submit">Enviar</button>
      </form>
      <p id="respostaEnvio" role="status"></p>
    </section>
  </main>
  <footer>
    <p>Projeto final de Desenvolvimento Web. Dados: PokéAPI.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
